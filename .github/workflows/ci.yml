name: CI

on:
  push:
    branches: [main, fix/macos-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (headless Qt + VTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            xvfb

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          pytest --tb=short

  build-windows:
    needs: test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/macos-build'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger les meshes (release meshes-v1)
        # Les meshes BodyParts3D (CC BY-SA 2.1 JP) ne sont pas dans git : on les
        # récupère depuis la release. Si elle n'existe pas, le build ÉCHOUE (pas
        # d'exécutable silencieusement sans meshes).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release download meshes-v1 --repo "${{ github.repository }}"                  --pattern 'bonylandmarks-meshes-*.zip' --dir dl; then
            echo "::error::Release 'meshes-v1' introuvable ou sans asset bonylandmarks-meshes-*.zip. Créer la release (gh release create meshes-v1 dist/bonylandmarks-meshes-v1.zip ...) avant de builder."
            exit 1
          fi
          ZIP=$(ls dl/bonylandmarks-meshes-*.zip | head -n 1)
          test -f "$ZIP" || { echo "::error::Asset meshes introuvable dans dl/"; exit 1; }
          python scripts/fetch_meshes.py --zip "$ZIP"

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Build Windows executable
        env:
          BONY_REQUIRE_MESHES: "1"
        run: pyinstaller --noconfirm packaging/BonyLandmarks.spec

      - name: Smoke test (frozen exe)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:BONY_REQUIRE_MESHES = "1"
          $env:BONY_SMOKE_LOG = "$PWD\smoke-windows.log"
          New-Item -ItemType File -Force $env:BONY_SMOKE_LOG | Out-Null
          $p = Start-Process -FilePath "dist\BonyLandmarks.exe" -ArgumentList "--smoke-test" `
                 -Wait -PassThru -NoNewWindow
          Get-Content $env:BONY_SMOKE_LOG
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-windows
          path: smoke-windows.log
          if-no-files-found: ignore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonyLandmarks-Windows
          path: dist/BonyLandmarks.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/macos-build'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger les meshes (release meshes-v1)
        # Les meshes BodyParts3D (CC BY-SA 2.1 JP) ne sont pas dans git : on les
        # récupère depuis la release. Si elle n'existe pas, le build ÉCHOUE (pas
        # d'exécutable silencieusement sans meshes).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release download meshes-v1 --repo "${{ github.repository }}"                  --pattern 'bonylandmarks-meshes-*.zip' --dir dl; then
            echo "::error::Release 'meshes-v1' introuvable ou sans asset bonylandmarks-meshes-*.zip. Créer la release (gh release create meshes-v1 dist/bonylandmarks-meshes-v1.zip ...) avant de builder."
            exit 1
          fi
          ZIP=$(ls dl/bonylandmarks-meshes-*.zip | head -n 1)
          test -f "$ZIP" || { echo "::error::Asset meshes introuvable dans dl/"; exit 1; }
          python scripts/fetch_meshes.py --zip "$ZIP"

      - name: Runner architecture
        run: |
          uname -m
          python -c "import platform, sys; print(platform.machine(), sys.version)"
          file "$(python -c 'import sys; print(sys.executable)')"

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Build macOS app (Apple Silicon)
        env:
          BONY_REQUIRE_MESHES: "1"
        run: pyinstaller --noconfirm packaging/BonyLandmarks.spec

      - name: Ad-hoc code signing and verification
        run: |
          # Les binaires arm64 doivent être signés (au moins ad-hoc), sinon le noyau les tue.
          codesign --force --deep --sign - dist/BonyLandmarks.app
          codesign --verify --deep --strict --verbose=2 dist/BonyLandmarks.app
          codesign -dv dist/BonyLandmarks.app 2>&1 | head -20
          plutil -p dist/BonyLandmarks.app/Contents/Info.plist

      - name: Trace architecture
        run: |
          EXE=dist/BonyLandmarks.app/Contents/MacOS/BonyLandmarks
          file "$EXE"
          lipo -info "$EXE"
          echo "--- binaires non-arm64 dans le bundle :"
          find dist/BonyLandmarks.app -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \)             -exec file {} + | grep "Mach-O" | grep -v arm64 | head -20 || true

      - name: Smoke test (frozen app)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export BONY_REQUIRE_MESHES=1
          export BONY_SMOKE_LOG="$PWD/smoke-macos.log"
          : > "$BONY_SMOKE_LOG"
          set +e
          dist/BonyLandmarks.app/Contents/MacOS/BonyLandmarks --smoke-test > smoke-macos.stdout.log 2> smoke-macos.stderr.log
          code=$?
          set -e
          echo "exit code: $code"
          echo "----- smoke log"; cat "$BONY_SMOKE_LOG"
          echo "----- stdout"; cat smoke-macos.stdout.log
          echo "----- stderr"; cat smoke-macos.stderr.log
          exit $code

      - name: Smoke test (plugin Qt cocoa réel, session GUI du runner)
        run: |
          find dist/BonyLandmarks.app -name "libqcocoa*"
          export QT_QPA_PLATFORM=cocoa
          export BONY_REQUIRE_MESHES=1
          export BONY_SMOKE_LOG="$PWD/smoke-macos-cocoa.log"
          : > "$BONY_SMOKE_LOG"
          set +e
          dist/BonyLandmarks.app/Contents/MacOS/BonyLandmarks --smoke-test > smoke-macos-cocoa.stdout.log 2> smoke-macos-cocoa.stderr.log
          code=$?
          set -e
          echo "exit code: $code"
          cat "$BONY_SMOKE_LOG"; echo "----- stderr"; cat smoke-macos-cocoa.stderr.log
          exit $code

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-macos
          path: smoke-macos*.log
          if-no-files-found: ignore

      - name: Zip .app bundle
        run: ditto -c -k --keepParent dist/BonyLandmarks.app dist/BonyLandmarks-macOS-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonyLandmarks-macOS-arm64
          path: dist/BonyLandmarks-macOS-arm64.zip
