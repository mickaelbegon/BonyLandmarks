name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (headless Qt + VTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            xvfb

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          pytest --tb=short

  build-windows:
    needs: test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --windowed --name BonyLandmarks `
            --add-data "src/bonylandmarks;bonylandmarks" `
            src/bonylandmarks/main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonyLandmarks-Windows
          path: dist/BonyLandmarks.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Build macOS app
        run: |
          pyinstaller --onefile --windowed --name BonyLandmarks \
            --add-data "src/bonylandmarks:bonylandmarks" \
            src/bonylandmarks/main.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonyLandmarks-macOS
          path: dist/BonyLandmarks
