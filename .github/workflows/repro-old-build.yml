name: repro-old-build (temporaire)
on:
  push:
    branches: [fix/macos-build]
jobs:
  repro:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ancien build (script main.py)
        run: |
          pyinstaller --windowed --name BonyLandmarksOld \
            --add-data "src/bonylandmarks:bonylandmarks" \
            src/bonylandmarks/main.py
      - name: Lancer l'ancien binaire
        run: |
          export QT_QPA_PLATFORM=offscreen
          set +e
          dist/BonyLandmarksOld.app/Contents/MacOS/BonyLandmarksOld > old.out 2> old.err
          echo "exit code: $?"
          echo "---- stdout"; cat old.out; echo "---- stderr"; cat old.err
          exit 0
