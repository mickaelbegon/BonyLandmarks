[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonylandmarks"
version = "0.1.0"
description = "Anatomical landmark placement tool for BodyLoop 3D scans"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "trimesh>=4.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pygltflib>=1.16",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyinstaller>=6.9",
]

[project.scripts]
bonylandmarks = "bonylandmarks.main:main"
bonylandmarks-annotate = "bonylandmarks.annotator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bonylandmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bonylandmarks --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
